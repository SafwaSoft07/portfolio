<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safwat Ahmed | Work</title>
<meta name="description" content="Safwat Ahmed, senior software engineer in Cairo. Mobile apps and websites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: one long showcase. Each work is a tinted stage with the real screenshots fanned out like phones in a hand,
   the name and the store link sit beside it, and the sides alternate. A slow reel of screens opens the page. */
:root{
  --bg:#F1F3F2;
  --surface:#FFFFFF;
  --surface-2:#E8ECEA;
  --fg:#101413;
  --muted:#56605C;
  --line:rgba(12,24,18,.13);
  --accent:#E9AA2B;
  --accent-ink:#1A1304;
  --accent-text:#8A5600;
  --ok:#0C8F4E;
  --ok-bg:rgba(12,143,78,.1);
  --ok-line:rgba(12,143,78,.4);
  --bezel:#0D0F0E;
  --shadow:0 30px 60px -24px rgba(10,30,20,.45);
  --glass:rgba(255,255,255,.78);
  --scrim:rgba(6,8,7,.86);
  --scrim-fg:#F2F0EB;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A;--surface:#121211;--surface-2:#1B1B19;--fg:#EDEBE6;--muted:#9C998F;--line:rgba(255,255,255,.1);
    --accent:#F2B84B;--accent-ink:#1A1304;--accent-text:#F2B84B;--ok:#3DDC84;--ok-bg:rgba(61,220,132,.1);--ok-line:rgba(61,220,132,.4);
    --bezel:#2B2B29;--shadow:0 30px 60px -20px rgba(0,0,0,.75);--glass:rgba(16,16,15,.76);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A;--surface:#121211;--surface-2:#1B1B19;--fg:#EDEBE6;--muted:#9C998F;--line:rgba(255,255,255,.1);
  --accent:#F2B84B;--accent-ink:#1A1304;--accent-text:#F2B84B;--ok:#3DDC84;--ok-bg:rgba(61,220,132,.1);--ok-line:rgba(61,220,132,.4);
  --bezel:#2B2B29;--shadow:0 30px 60px -20px rgba(0,0,0,.75);--glass:rgba(16,16,15,.76);color-scheme:dark;
}
:lang(ar){--font-display:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--font-mono:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{max-width:100%}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding-block:10px 120px;position:relative}
.glow{position:absolute;inset:0 0 auto;height:640px;pointer-events:none;z-index:-1;
  background:radial-gradient(520px 320px at 16% 6%,rgba(233,170,43,.16),transparent 70%),radial-gradient(460px 300px at 90% 12%,rgba(12,143,78,.1),transparent 70%)}
.ic{width:18px;height:18px;flex:none}
.flip{display:inline-block}
[dir="rtl"] .flip{transform:scaleX(-1)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* nav */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 8px 7px 18px;padding-inline:18px 8px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.logo{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.03em;text-decoration:none}
.logo span{color:var(--accent-text)}
.nav-end{display:flex;align-items:center;gap:6px}
.navlink{display:none;text-decoration:none;color:var(--muted);font-size:14px;padding:8px 12px;border-radius:999px}
.navlink:hover{color:var(--fg)}
@media(min-width:640px){.navlink{display:inline-block}}
.icon-btn{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:600 13px/1 var(--font-body);cursor:pointer;transition:border-color .2s,transform .2s}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.icon-btn.sq{padding:0;width:40px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;border-radius:14px;border:1px solid transparent;font:600 15px/1 var(--font-body);cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(233,170,43,.32)}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);transform:translateY(-2px)}
.btn.sm{padding:10px 16px;font-size:14px;border-radius:999px}

/* hero */
.hero{padding-block:clamp(40px,7vw,84px) clamp(28px,4vw,44px);display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.avail{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line);box-shadow:0 0 28px var(--ok-bg)}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok-line)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(3.1rem,10.5vw,8rem);line-height:.94;letter-spacing:-.045em;text-wrap:balance}
:lang(ar) h1{line-height:1.2;letter-spacing:0;font-weight:700}
.role{margin:0;max-width:30ch;color:var(--muted);font-size:clamp(1.1rem,2.2vw,1.45rem);line-height:1.45}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;color:var(--muted);font-size:14px}
.hero-meta b{font-family:var(--font-display);font-size:26px;letter-spacing:-.03em;color:var(--fg);margin-inline-end:6px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}
.hero-meta b{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* reel */
.reel{direction:ltr;overflow:hidden;margin-top:8px;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.reel-track{display:flex;gap:14px;width:max-content;animation:reel 80s linear infinite;padding-block:6px 14px}
.reel:hover .reel-track{animation-play-state:paused}
@keyframes reel{to{transform:translateX(calc(-50% - 7px))}}
.reel button{flex:none;height:clamp(210px,27vw,300px);aspect-ratio:738/1600;padding:0;border-radius:20px;border:3px solid var(--bezel);overflow:hidden;background:#000;cursor:pointer;box-shadow:var(--shadow);transition:transform .3s}
.reel button:hover{transform:translateY(-6px)}
.reel img{width:100%;height:100%;object-fit:cover;display:block}

/* section head */
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-block:clamp(64px,9vw,112px) 36px;scroll-margin-top:90px}
h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;letter-spacing:-.035em}
:lang(ar) h2{letter-spacing:0;line-height:1.25;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filter{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 14px/1 var(--font-body);cursor:pointer;transition:all .2s}
.filter:hover{color:var(--fg);border-color:var(--accent)}
.filter[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.filter .n{font-family:var(--font-mono);font-size:11px;opacity:.7}

/* works */
.works{display:grid;gap:clamp(56px,8vw,104px)}
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-items:center;--h:clamp(340px,92vw,400px)}
@media(min-width:900px){
  .work{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(36px,5vw,72px);--h:500px}
  .work.alt{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .work.alt .stage{order:2}
}
.stage{position:relative;display:block;width:100%;height:var(--h);padding:0;font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:30px;overflow:hidden;
  background:radial-gradient(80% 70% at 50% 0%,rgba(var(--c),.4),transparent 72%),linear-gradient(180deg,rgba(var(--c),.14),rgba(var(--c),.03)),var(--surface);
  --ph:calc(var(--h) * .92);--pw:calc(var(--ph) * .4614);transition:border-color .3s,transform .3s}
.stage:hover{border-color:rgba(var(--c),.7)}
.phone{display:block;position:absolute;left:50%;bottom:calc(var(--ph) * -.1);width:var(--pw);aspect-ratio:738/1600;border-radius:calc(var(--pw) * .13);border:calc(var(--pw) * .028) solid var(--bezel);background:#000;overflow:hidden;box-shadow:var(--shadow);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
.phone.c{z-index:3;transform:translateX(-50%)}
.phone.l{z-index:2;transform:translateX(calc(-50% - var(--pw) * .74)) translateY(5%) rotate(-5deg) scale(.9)}
.phone.r{z-index:2;transform:translateX(calc(-50% + var(--pw) * .74)) translateY(5%) rotate(5deg) scale(.9)}
.stage:hover .phone.c{transform:translateX(-50%) translateY(-12px)}
.stage:hover .phone.l{transform:translateX(calc(-50% - var(--pw) * .8)) translateY(1%) rotate(-7deg) scale(.9)}
.stage:hover .phone.r{transform:translateX(calc(-50% + var(--pw) * .8)) translateY(1%) rotate(7deg) scale(.9)}
/* website frames */
.stage.web{--ww:calc(var(--h) * .6)}
.win{position:absolute;left:50%;bottom:calc(var(--h) * -.05);width:var(--ww);aspect-ratio:.76;border-radius:14px;border:1px solid var(--line);background:#fff;overflow:hidden;box-shadow:var(--shadow);transition:transform .6s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.win .bar{display:flex;gap:5px;padding:8px 10px;background:#E8ECEA;flex:none}
.win .bar i{width:7px;height:7px;border-radius:50%;background:#B8C0BC}
.win img{flex:1;min-height:0;width:100%;object-fit:cover;object-position:top;display:block}
.win.c{z-index:3;transform:translateX(-50%)}
.win.l{z-index:2;transform:translateX(calc(-50% - var(--ww) * .7)) translateY(4%) rotate(-4deg) scale(.92)}
.win.r{z-index:2;transform:translateX(calc(-50% + var(--ww) * .7)) translateY(4%) rotate(4deg) scale(.92)}
.stage:hover .win.c{transform:translateX(-50%) translateY(-12px)}
.stage:hover .win.l{transform:translateX(calc(-50% - var(--ww) * .76)) translateY(1%) rotate(-6deg) scale(.92)}
.stage:hover .win.r{transform:translateX(calc(-50% + var(--ww) * .76)) translateY(1%) rotate(6deg) scale(.92)}
.count{position:absolute;z-index:5;inset-block-start:16px;inset-inline-end:16px;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;font-weight:600;color:var(--fg)}
.info{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0}
.kind{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
:lang(ar) .kind{letter-spacing:0;text-transform:none;font-size:14px;font-weight:600}
h3{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,5vw,3.7rem);line-height:1;letter-spacing:-.04em;text-wrap:balance}
:lang(ar) h3{letter-spacing:0;line-height:1.2;font-weight:700}
.alt-name{color:var(--muted);font-size:clamp(1.1rem,2vw,1.4rem);margin-top:-6px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.rv{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.pre{opacity:0;transform:translateY(30px)}
.rv.pre.in{opacity:1;transform:none}

/* contact */
.contact{margin-top:clamp(72px,10vw,128px);padding:clamp(28px,5vw,56px);border-radius:32px;border:1px solid var(--line);display:grid;gap:30px;scroll-margin-top:90px;
  background:linear-gradient(150deg,rgba(233,170,43,.16),transparent 60%),var(--surface)}
@media(min-width:900px){.contact{grid-template-columns:1.2fr 1fr;align-items:center;gap:56px}}
.contact h2{font-size:clamp(2rem,5vw,3.6rem);max-width:14ch;text-wrap:balance}
.lines{display:flex;flex-direction:column;gap:10px;min-width:0}
.line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line);min-width:0}
.line .val{flex:1;min-width:0;direction:ltr;unicode-bidi:isolate;font-family:var(--font-mono);font-size:14px;overflow-wrap:anywhere;text-align:start}
[dir="rtl"] .line .val{text-align:right}
@media(max-width:520px){.line .val{flex-basis:calc(100% - 40px)}}
.line .ic{color:var(--accent-text)}
footer{margin-top:48px;padding-top:26px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;color:var(--muted);font-size:14px}

/* floating contact */
.fab{position:fixed;z-index:55;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-menu{display:flex;flex-direction:column;gap:8px;align-items:flex-end;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s,transform .25s}
.fab.open .fab-menu{opacity:1;transform:none;pointer-events:auto}
.fab-item{display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--fg);font:500 14px/1 var(--font-body);text-decoration:none;cursor:pointer;white-space:nowrap}
.fab-item:hover{border-color:var(--accent)}
.fab-item .ic{color:var(--accent-text)}
.fab-btn{width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 12px 34px rgba(233,170,43,.4);transition:transform .25s}
.fab-btn:hover{transform:scale(1.07)}
.fab-btn .ic{width:24px;height:24px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:90;display:flex;color:var(--scrim-fg)}
.lb-back{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .25s both}
.lb-panel{position:relative;flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.lb-title{display:flex;align-items:baseline;gap:12px;min-width:0}
.lb-title b{font-family:var(--font-display);font-size:clamp(1.1rem,3vw,1.5rem);letter-spacing:-.02em}
.lb-title span{font-family:var(--font-mono);font-size:13px;opacity:.7;font-variant-numeric:tabular-nums;direction:ltr}
.lb-top-actions{display:flex;align-items:center;gap:8px}
.lb .icon-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:var(--scrim-fg)}
.lb-view{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:14px;touch-action:pan-y}
.lb-view img{max-width:100%;max-height:100%;object-fit:contain;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fade .25s both}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,20,20,.6);color:var(--scrim-fg);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lb-nav:hover{border-color:var(--accent)}
.lb-nav.prev{inset-inline-start:4px}
.lb-nav.next{inset-inline-end:4px}
.lb-thumbs{flex:none;display:flex;gap:8px;overflow-x:auto;justify-content:safe center;padding-block:6px;direction:ltr}
.lb-thumbs button{flex:none;width:44px;aspect-ratio:738/1600;padding:0;border-radius:8px;overflow:hidden;border:2px solid transparent;opacity:.5;cursor:pointer;background:#000;transition:opacity .2s,border-color .2s}
.lb-thumbs.web button{aspect-ratio:.76;width:56px}
.lb-thumbs button[aria-current="true"]{opacity:1;border-color:var(--accent)}
.lb-thumbs img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:95;max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;background:var(--surface);color:var(--fg);border:1px solid var(--accent);font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reel{overflow-x:auto;mask-image:none;-webkit-mask-image:none}
  .reel-track{animation:none}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    <symbol id="i-cl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-cr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>

<script>
/* ---------- edit here ---------- */
const WHATSAPP = '201002380523';
const EMAIL = 'safwatsoft07@gmail.com';
const PLAY = 'https://play.google.com/store/apps/details?id=com.safwatahmed.';
const LINKS = {
  fusha:     PLAY + 'fos7a',
  bus:       PLAY + 'busegypt',
  afnan:     '',                       // paste the AL-AFNAN Google Play link here
  zarati:    PLAY + 'zarati',
  suhbat:    PLAY + 'suhbat_khayr',
  workspace: PLAY + 'workspace_app',
  viewlight: 'https://viewlight-eg.com/'
};
const IMG = (id, n) => `assets/images/${id}/${n}.jpg`;

/* c = tint color of the stage, shots = number of screenshots, show = three shots on the stage (middle one is in front) */
const WORKS = [
  {id:'fusha',    type:'app', c:'245,138,59', shots:6, show:[3,2,4], name:{en:'Fusha',          ar:'فسحة'},          kind:{en:'Places discovery app',        ar:'تطبيق اكتشاف الأماكن'}},
  {id:'bus',      type:'app', c:'36,104,196', shots:8, show:[3,2,5], name:{en:'Bus Egypt',      ar:'اتوبيس مصر'},    kind:{en:'Public transport guide',      ar:'دليل المواصلات العامة'}},
  {id:'afnan',    type:'app', c:'196,150,60', shots:4, show:[1,2,3], name:{en:'AL-AFNAN',       ar:'الأفنان'},       kind:{en:'Quran and Tajwid learning',   ar:'تعلّم القرآن والتجويد'}},
  {id:'zarati',   type:'app', c:'70,170,80',  shots:4, show:[1,2,3], name:{en:'Zar3ty',         ar:'زرعتي'},         kind:{en:'Home gardening assistant',    ar:'مساعد الزراعة المنزلية'}},
  {id:'suhbat',   type:'app', c:'40,120,150', shots:6, show:[1,2,3], name:{en:'Suhbat Khayr',   ar:'صحبة خير'},      kind:{en:'Prophets and Companions',     ar:'سِيَر الأنبياء والصحابة'}},
  {id:'workspace',type:'app', c:'30,150,130', shots:5, show:[1,2,4], name:{en:'WorkSpace Egypt',ar:'مساحات العمل'},  kind:{en:'Coworking spaces directory',  ar:'دليل مساحات العمل المشتركة'}},
  {id:'viewlight',type:'web', c:'18,120,86',  shots:3, show:[2,1,3], name:{en:'VIEW Light',     ar:'VIEW Light'},    kind:{en:'Lighting and electrical store',ar:'متجر إضاءة ومستلزمات كهرباء'}}
];

const T = {
  en:{title:'Safwat Ahmed | Work',nav_work:'Work',nav_contact:'Contact',avail:'Available for Freelance Projects',name:'Safwat Ahmed',
    role:'Senior software engineer. Mobile apps and websites, from Cairo.',wa:'WhatsApp',cv:'Download CV',cv_short:'Download CV',mail:'Email',copy:'Copy',copy_mail:'Copy email',
    years:'years of experience',apps:'apps on Google Play',work:'Selected work',all:'All',app:'Apps',web:'Websites',
    play:'Open on Google Play',site:'Visit website',shots:'Screenshots',contact_h:'Have a project? Let’s talk.',foot:'© 2026 Safwat Ahmed',
    lang:'عربي',langLabel:'التبديل إلى العربية',themeToDark:'Dark mode',themeToLight:'Light mode',close:'Close',prev:'Previous',next:'Next',copied:'Email copied',
    fabOpen:'Quick contact',fabClose:'Close menu'},
  ar:{title:'صفوت أحمد | الأعمال',nav_work:'الأعمال',nav_contact:'تواصل',avail:'متاح لمشاريع العمل الحر',name:'صفوت أحمد',
    role:'مهندس برمجيات أول. تطبيقات موبايل ومواقع، من القاهرة.',wa:'واتساب',cv:'تحميل السيرة الذاتية',cv_short:'تحميل السيرة الذاتية',mail:'البريد',copy:'نسخ',copy_mail:'نسخ البريد',
    years:'سنة خبرة',apps:'تطبيقات على Google Play',work:'أعمال مختارة',all:'الكل',app:'تطبيقات',web:'مواقع',
    play:'افتح على Google Play',site:'زيارة الموقع',shots:'اللقطات',contact_h:'لديك مشروع؟ لنتحدث.',foot:'© 2026 صفوت أحمد',
    lang:'EN',langLabel:'Switch to English',themeToDark:'الوضع الداكن',themeToLight:'الوضع الفاتح',close:'إغلاق',prev:'السابق',next:'التالي',copied:'تم نسخ البريد',
    fabOpen:'تواصل سريع',fabClose:'إغلاق القائمة'}
};

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const root = document.documentElement;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const waLink = () => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(lang==='ar' ? 'مرحباً صفوت، شاهدت أعمالك وأريد التحدث عن مشروع.' : 'Hi Safwat, I saw your portfolio and would like to talk about a project.')}`;
const ico = (id, cls='ic') => `<svg class="${cls}"><use href="#${id}"/></svg>`;

let lang = store.get('sa_lang') || ((navigator.language||'en').toLowerCase().startsWith('ar') ? 'ar' : 'en');
let filter = 'all';
let toastTimer;

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
async function copyMail(){
  try { await navigator.clipboard.writeText(EMAIL); toast(T[lang].copied); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = EMAIL; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); toast(ok ? T[lang].copied : EMAIL);
  }
}

/* ---------- theme ---------- */
const mq = matchMedia('(prefers-color-scheme: dark)');
const effTheme = () => root.dataset.theme || (mq.matches ? 'dark' : 'light');
function syncThemeBtn(){
  const dark = effTheme() === 'dark';
  $('#themeUse').setAttribute('href', dark ? '#i-sun' : '#i-moon');
  const b = $('#themeBtn'); const label = dark ? T[lang].themeToLight : T[lang].themeToDark;
  b.setAttribute('aria-label', label); b.title = label;
}
(function initTheme(){
  const saved = store.get('sa_theme');
  if (saved === 'dark' || saved === 'light') root.dataset.theme = saved;
  mq.addEventListener && mq.addEventListener('change', syncThemeBtn);
})();
$('#themeBtn').addEventListener('click', () => {
  const next = effTheme() === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next; store.set('sa_theme', next); syncThemeBtn();
});

/* ---------- render ---------- */
function stageHTML(w){
  const name = w.name[lang];
  const sh = w.show;
  const cls = ['l','c','r'];
  const frames = w.type === 'app'
    ? sh.map((n,i) => `<span class="phone ${cls[i]}"><img src="${IMG(w.id,n)}" width="738" height="1600" alt="${name} ${n}" loading="lazy" decoding="async"></span>`).join('')
    : sh.map((n,i) => `<span class="win ${cls[i]}"><span class="bar"><i></i><i></i><i></i></span><img src="${IMG(w.id,n)}" width="599" height="896" alt="${name} ${n}" loading="lazy" decoding="async"></span>`).join('');
  return `<button class="stage ${w.type==='web'?'web':''}" type="button" data-open="${w.id}" data-i="${w.show[1]}" aria-label="${T[lang].shots}: ${name}">
      ${frames}<span class="count">${ico('i-imgs')}${w.shots}</span></button>`;
}
function renderWorks(){
  const other = lang === 'ar' ? 'en' : 'ar';
  const list = WORKS.filter(w => filter === 'all' || w.type === filter);
  $('#works').innerHTML = list.map((w,i) => {
    const link = LINKS[w.id];
    const label = w.type === 'web' ? T[lang].site : T[lang].play;
    const icon = w.type === 'web' ? 'i-globe' : 'i-play';
    const alt = w.name[other] !== w.name[lang] ? `<div class="alt-name" lang="${other}">${w.name[other]}</div>` : '';
    return `<article class="work rv ${i%2 ? 'alt' : ''}" style="--c:${w.c}" id="w-${w.id}">
      ${stageHTML(w)}
      <div class="info">
        <span class="kind">${w.kind[lang]}</span>
        <h3>${w.name[lang]}</h3>${alt}
        <div class="actions">
          ${link ? `<a class="btn primary" href="${link}" target="_blank" rel="noopener">${ico(icon)}${label}${ico('i-out')}</a>` : ''}
          <button class="btn ghost" type="button" data-open="${w.id}" data-i="1">${ico('i-imgs')}${T[lang].shots} · ${w.shots}</button>
        </div>
      </div>
    </article>`;
  }).join('');
  observeReveal();
}
function renderFilters(){
  const defs = [['all', WORKS.length], ['app', WORKS.filter(w=>w.type==='app').length], ['web', WORKS.filter(w=>w.type==='web').length]];
  $('#filters').innerHTML = defs.map(([k,n]) => `<button class="filter" type="button" data-filter="${k}" aria-pressed="${k===filter}">${T[lang][k]}<span class="n">${n}</span></button>`).join('');
}
function renderReel(){
  const apps = WORKS.filter(w => w.type === 'app');
  const items = [];
  for (let r = 0; r < 3; r++) apps.forEach(w => items.push({w, n: w.show[[1,0,2][r]]}));
  const html = hidden => items.map(({w,n}) =>
    `<button type="button" data-open="${w.id}" data-i="${n}" ${hidden ? 'tabindex="-1" aria-hidden="true"' : `aria-label="${w.name[lang]}"`}><img src="${IMG(w.id,n)}" width="738" height="1600" alt="" loading="lazy" decoding="async"></button>`).join('');
  $('#reel').innerHTML = html(false) + html(true);
}

/* ---------- language ---------- */
function applyLang(){
  const t = T[lang];
  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t.title;
  $$('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  const lb = $('#langBtn'); lb.textContent = t.lang; lb.setAttribute('aria-label', t.langLabel); lb.lang = lang === 'ar' ? 'en' : 'ar';
  ['#heroWa','#contactWa','#fabWa'].forEach(s => $(s).href = waLink());
  $('#lbClose').setAttribute('aria-label', t.close); $('#lbPrev').setAttribute('aria-label', t.prev); $('#lbNext').setAttribute('aria-label', t.next);
  setFab(fab.classList.contains('open'));
  renderFilters(); renderWorks(); renderReel(); syncThemeBtn();
  if (!$('#lb').hidden) lbRender();
}
$('#langBtn').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set('sa_lang', lang); applyLang(); });

/* ---------- floating contact ---------- */
const fab = $('#fab');
function setFab(open){
  fab.classList.toggle('open', open);
  const b = $('#fabBtn'); b.setAttribute('aria-expanded', String(open));
  b.setAttribute('aria-label', open ? T[lang].fabClose : T[lang].fabOpen);
  $('#fabUse').setAttribute('href', open ? '#i-x' : '#i-msg');
}
$('#fabBtn').addEventListener('click', e => { e.stopPropagation(); setFab(!fab.classList.contains('open')); });
$('#fabMail').addEventListener('click', () => { copyMail(); setFab(false); });
$('#copyMail').addEventListener('click', copyMail);

/* ---------- lightbox ---------- */
const lbState = {id:null, i:1, opener:null};
const workById = id => WORKS.find(w => w.id === id);
function lbRender(){
  const w = workById(lbState.id); if (!w) return;
  const i = lbState.i;
  $('#lbName').textContent = w.name[lang];
  $('#lbCount').textContent = `${i} / ${w.shots}`;
  const img = $('#lbImg'); img.src = IMG(w.id, i); img.alt = `${w.name[lang]} ${i}`;
  const link = LINKS[w.id], a = $('#lbLink');
  a.hidden = !link; if (link){ a.href = link; a.innerHTML = `${ico(w.type==='web'?'i-globe':'i-play')}${w.type==='web'?T[lang].site:T[lang].play}${ico('i-out')}`; }
  const th = $('#lbThumbs'); th.className = 'lb-thumbs' + (w.type==='web' ? ' web' : '');
  th.innerHTML = Array.from({length:w.shots}, (_,k) => k+1).map(n =>
    `<button type="button" data-thumb="${n}" aria-label="${n}" ${n===i?'aria-current="true"':''}><img src="${IMG(w.id,n)}" alt="" loading="lazy"></button>`).join('');
  const cur = th.querySelector('[aria-current="true"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({inline:'center', block:'nearest'});
}
function lbOpen(id, i, opener){
  lbState.id = id; lbState.i = i; lbState.opener = opener || document.activeElement;
  $('#lb').hidden = false; document.body.style.overflow = 'hidden';
  lbRender(); $('#lbClose').focus();
}
function lbClose(){
  $('#lb').hidden = true; document.body.style.overflow = '';
  const o = lbState.opener; if (o && o.focus) { try { o.focus(); } catch(e){} }
}
function lbStep(d){
  const w = workById(lbState.id); if (!w) return;
  lbState.i = ((lbState.i - 1 + d + w.shots) % w.shots) + 1; lbRender();
}
$('#lbPrev').addEventListener('click', () => lbStep(-1));
$('#lbNext').addEventListener('click', () => lbStep(1));
let sx = null;
$('#lbView').addEventListener('pointerdown', e => { sx = e.clientX; });
$('#lbView').addEventListener('pointerup', e => {
  if (sx === null) return; const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 50) lbStep((dx < 0 ? 1 : -1) * (lang === 'ar' ? -1 : 1));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#lb').hidden) lbClose(); setFab(false); return; }
  if ($('#lb').hidden) return;
  const rtl = lang === 'ar';
  if (e.key === 'ArrowLeft') lbStep(rtl ? 1 : -1);
  if (e.key === 'ArrowRight') lbStep(rtl ? -1 : 1);
});

/* ---------- clicks ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-filter],[data-lb-close],[data-thumb]');
  if (!t) { if (!e.target.closest('#fab')) setFab(false); return; }
  if (t.dataset.open) lbOpen(t.dataset.open, +t.dataset.i || 1, t);
  else if (t.dataset.filter) { filter = t.dataset.filter; renderFilters(); renderWorks(); }
  else if ('lbClose' in t.dataset) lbClose();
  else if (t.dataset.thumb) { lbState.i = +t.dataset.thumb; lbRender(); }
});

/* ---------- scroll reveal (only blocks below the first screen wait) ---------- */
let io = null;
function observeReveal(){
  if (reduce || !('IntersectionObserver' in window)) return;
  if (!io) io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), {threshold:.12, rootMargin:'0px 0px -6% 0px'});
  $$('.rv:not(.pre)').forEach(el => {
    if (el.getBoundingClientRect().top > innerHeight * .92){ el.classList.add('pre'); io.observe(el); }
  });
}
